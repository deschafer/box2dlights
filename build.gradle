apply plugin: 'java'

group = 'com.badlogicgames.box2dlights'
version = '1.5-SNAPSHOT'
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

ext {
    gdxVersion = '1.11.0'
}

repositories {
    mavenCentral()
    jcenter()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

sourceSets {
    main {
        java.srcDirs = ['src/']
        resources.srcDirs = ['resources/']
    }
    test {
        java.srcDirs = ['tests/']
    }
}

dependencies {
    implementation group: 'com.badlogicgames.gdx', name: 'gdx-backend-lwjgl3', version: '1.11.0'
    implementation group: 'com.badlogicgames.gdx', name: 'gdx', version: '1.11.0'
    implementation group: 'com.badlogicgames.gdx', name: 'gdx-box2d', version: '1.11.0'
    implementation group: 'com.badlogicgames.gdx', name: 'gdx-freetype', version: '1.11.0'
}

jar {
    archiveName = "box2dlights-smooth.jar"
}
