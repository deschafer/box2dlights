plugins {
	id 'java-library'
	id 'maven-publish'
}

group = 'com.badlogicgames.box2dlights'

sourceSets {
	main {
		java {
			srcDirs = ["src"]
		}
	}
	test {
		java {
			srcDirs = ["test"]
		}
	}
}

task libraryJar(type: Jar, dependsOn:classes) {
	from sourceSets.main.output.classesDirs
	from configurations.compile.collect { it.isDirectory() ? it : zipTree(it) }
	classifier = 'library'
}

task sourcesJar(type: Jar, dependsOn:classes) {
	from sourceSets.main.allSource
	classifier = 'sources'
}

task javadocJar(type: Jar, dependsOn:javadoc) {
	from javadoc.destinationDir
	classifier = 'javadoc'
}

artifacts {
	archives libraryJar
	archives sourcesJar
	archives javadocJar
}


publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'com.badlogicgames.box2dlights'
			artifactId = 'box2dlights'

			from components.java
			afterEvaluate {
				artifact libraryJar
				artifact sourcesJar
				artifact javadocJar
			}
		}
	}
}


ext.gdxVersion = "1.9.10"
// custom
version = "2.0.custom-SNAPSHOT"

repositories {
	mavenCentral()
}

dependencies {
	implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
	implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
	testImplementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
	testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
	testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}